<svg width="900" height="340" viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');

      text {
        font-family: 'Press Start 2P', 'Courier New', monospace;
        image-rendering: pixelated;
      }

      @keyframes chipBorderPulse {
        0%, 100% { stroke-width: 2; filter: none; }
        4% { stroke-width: 4; filter: drop-shadow(0 0 6px currentColor); }
        9% { stroke-width: 2; filter: none; }
      }

      @keyframes chipTextPulse {
        0%, 100% { fill: #eaeaea; }
        4% { fill: #ffffff; }
        9% { fill: #eaeaea; }
      }

      .chip-border {
        animation: chipBorderPulse 7.7s linear infinite;
      }

      .chip-text {
        animation: chipTextPulse 7.7s linear infinite;
      }

      .icon {
        shape-rendering: crispEdges;
      }
    </style>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0e23"/>
      <stop offset="100%" stop-color="#1b1035"/>
    </linearGradient>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.10"/>
    </pattern>

    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path
        d="M20 0L0 0 0 20"
        fill="none"
        stroke="#fff"
        stroke-opacity="0.035"
      />
    </pattern>
  </defs>

  <!-- BACKGROUND -->
  <rect width="900" height="340" fill="url(#bg)"/>
  <rect width="900" height="340" fill="url(#grid)"/>

  <!-- FRAME -->
  <rect
    x="6" y="6"
    width="888" height="328"
    fill="none"
    stroke="#ff2e63"
    stroke-width="4"
    shape-rendering="crispEdges"
  />

  <rect
    x="12" y="12"
    width="876" height="316"
    fill="none"
    stroke="#08d9d6"
    stroke-width="2"
    stroke-dasharray="6 4"
    shape-rendering="crispEdges"
  />

  <!-- CORNERS -->
  <g stroke="#eaff00" stroke-width="3" fill="none" shape-rendering="crispEdges">
    <path d="M18 40V18H40"/>
    <path d="M860 18H882V40"/>
    <path d="M18 300V322H40"/>
    <path d="M860 322H882V300"/>
  </g>

  <!-- HEADER -->
  <text x="30" y="58" font-size="13" fill="#08d9d6" letter-spacing="1">
    &gt; SYSTEM.BOOT()
  </text>

  <text
